; Floggfy configuration
; ---------------------
; Fully quit every Spotify.exe process before editing this file, then restart.
; Settings changed from the To Disk menu are applied and saved automatically.
; Unless a setting says otherwise, use exactly 0 for disabled or 1 for enabled.
; Floggfy is an unofficial client modification. Spotify updates can make optional
; hooks unavailable; unsupported features fail closed instead of guessing.

[To Disk]
; === General capture and interface ===

; Master switch for new audio capture, publication, and existing-file metadata
; updates. 0 leaves existing files untouched and disables every format below.
; Default: 1.
Downloads=1

; Show Floggfy's To Disk submenu in Spotify. This changes only the interface;
; Downloads and other enabled background features still run when Menu=0.
; INI-only and restart-required. Default: 1.
Menu=1

; Root folder for music, podcasts, duplicate collisions, and log files.
; Empty uses the Windows Music known folder plus \Spotify. A custom value must be
; an absolute drive or UNC path. The To Disk menu can change this while running.
Save Location=

; === Output formats ===
; Format switches retain Spotify's original compressed stream; they do not
; convert one codec into another or improve the quality Spotify supplied.

; Save native Ogg Vorbis music. Default: 1.
Ogg=1

; Save native FLAC music only when Spotify actually supplies lossless FLAC.
; Selecting FLAC here does not force Spotify's playback quality. Default: 1.
Flac=1

; Save supported native AAC/SpAC music as M4A. AAC is normally a lower-quality
; source and support depends on the Spotify build. INI-only; restart required.
; Default: 0.
Aac=0

; Save fully listened Spotify episodes as native MP3 under Podcasts\<Show>.
; Partial episodes, ads, and ordinary music are not published as podcasts.
; Default: 0.
Podcasts=0

; === Metadata and automatic actions ===

; Enable Spotify-backed title, artist, album, artwork, and related enrichment.
; 0 disables enrichment hooks but not basic capture identity. Restart required.
; Default: 1.
Metadata=1

; Request and embed available lyrics without opening Spotify's lyrics panel.
; Requires Metadata=1. Disabling retains lyrics already stored in files.
; Default: 1.
Lyrics=1

; Update missing lyrics, artwork, and tags as soon as an owned existing file is
; identified. This does not replace its audio unless a verified quality upgrade
; is also available. Requires Downloads=1 and Metadata=1. Default: 1.
UpdateExistingMetadata=1

; After the existing-file metadata check completes, skip downloaded music when
; the current source cannot provide a better FLAC replacement. Never skips
; podcasts or an unverified file. Disabled by default to avoid surprise skips.
AutoSkipDownloaded=0

; === Filenames ===

; Prefix new music filenames with the known track number. Existing audio is not
; renamed merely by enabling this option. INI-only; restart required. Default: 0.
TrackNumberInFilename=0

; When numbering is disabled, rename verified older numbered files to title-only
; names at playback start without rewriting their audio. Automatically disabled
; when TrackNumberInFilename=1. INI-only; restart required. Default: 0.
ConvertNumberedFilenames=0

; === Playback evidence and compatibility ===

; Last-resort playback-state source when Spotify's own app state is unavailable.
; Windows media state has weaker identity evidence, so keep this off unless the
; Spotify source is broken on the installed client. Restart required. Default: 0.
Windows Playback Fallback=0

; Local capture/playback rate. Accepted values are exactly 1, 2, 4, 8, or 10.
; WARNING: accelerated modes can make Spotify fetch media and poll services much
; faster than normal. Repeated unattended use can trigger throttling or account
; enforcement, including a possible service ban. This use is unsupported and at
; your own risk. Acceleration can also sound choppy and show inaccurate progress.
; Saved compressed audio is not resampled. If the required hook is unavailable,
; Floggfy falls back to 1x. Restart after manual edits. Default: 1.
CaptureSpeed=1

; Hidden INI safety switch for the Capture Speed menu; despite its legacy name,
; this is not a numeric ceiling. 0 hides the menu, disables acceleration, and
; forces a saved accelerated speed back to 1x at startup. Missing or any valid
; nonzero value shows all supported choices when the hook is available.
; INI-only and restart-required. Default: 1.
CaptureSpeedLimit=1

; Compatibility workaround for systems where disabled Microsoft NCSI checks make
; Spotify falsely report no internet. It reports a usable adapter as connected
; inside Spotify only; it does not change Windows, test bandwidth, or force audio
; quality. Enable only for that specific false-offline problem. Restart required.
; Default: 0.
NetworkPatch=0

; === Logging and diagnostics ===
; Logs use local timestamps and are stored under Save Location. Each log is capped
; at 5 MiB. Diagnostic lanes use separate files and bounded queues.

; General log detail. Only exact values 0, 1, 2, and 4 are valid:
;   0 = no logging
;   1 = completed tracks plus warnings and failures
;   2 = level 1 plus starts, upgrades, skips, renames, and setting activity
;   4 = level 2 plus playback, metadata, capture, and ownership diagnostics
; General events use Floggfy.log; level-4 detail uses Floggfy-diagnostics.log.
; Missing or invalid values normalize to 1. Default: 1.
LogLevel=1

; At LogLevel=4, record cached Connect playback-target changes and passive local
; action observations in Floggfy-diagnostics.log. It sends no commands or extra
; requests and omits device names and IDs. Restart required. Default: 1.
DebugConnect=1

; At LogLevel=4, enable bounded read-only Connect/enrichment observations in
; Floggfy-networking.log. No raw payloads, media, credentials, URLs, device names,
; or device IDs are written. Adds an optional compatibility-sensitive hook, so
; leave disabled unless diagnosing a networking/control problem. Restart required.
; Default: 0.
DebugNetworking=0

; At LogLevel=4, profile callback/queue timing and worker progress in
; Floggfy-hook-diagnostics.log. It performs no media or memory dumps, but adds
; diagnostic overhead. Enable only while investigating stalls. Restart required.
; Default: 0.
DebugHookDiagnostics=0

[History]
; Total compressed audio Floggfy may retain in RAM while correlating captures.
; Values are clamped to 8-512 MiB. A low limit can discard long or overlapping
; streams; a high limit permits more memory use. No scratch audio is written to
; disk. INI-only and restart-required. Default: 500.
MaxBufferedMiB=500
