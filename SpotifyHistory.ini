[To Disk]
; Settings also appear in the To Disk menu.
Downloads=1
; Set Menu=0 before starting Spotify to disable native menu integration.
Menu=1
; Workaround when disabled/blocked Microsoft online checks (Windows NCSI)
; make Windows report "No Internet" despite a working connection.
; Reports an active adapter with a usable IP as Internet-connected to Spotify,
; helping it avoid false-offline restrictions on playback/quality selection.
; Spotify-only: does not change Windows network status or re-enable the checks.
; Does not test connection speed or force highest quality; choose it in Spotify.
; 0=off (default), 1=on. Fully quit and restart Spotify after changing.
NetworkPatch=0
; Empty uses the Windows Music folder plus \Spotify.
Save Location=
; Prefix new filenames with the track number when known.
TrackNumberInFilename=0
; At track start, rename verified old numbered files without rewriting audio.
; TrackNumberInFilename=1 disables conversion.
ConvertNumberedFilenames=0
Ogg=1
; Captures native FLAC when Spotify supplies lossless audio.
Flac=1
; AAC is usually a low-quality source; opt in explicitly.
Aac=0
; Enables metadata enrichment using the local Spotify client.
Metadata=1
; Automatically obtains lyrics; Metadata=0 disables all enrichment.
Lyrics=1
; Refreshes verified existing files as metadata arrives; no full replay needed.
; Files held open by another app retry while the track remains current.
UpdateExistingMetadata=1

; Normal activity, warnings and failures: Floggfy.log in Save Location (5 MiB).
; Log=0 also disables ALL debug output, hooks and timing instrumentation below.
Log=1

; Debug options require Log=1. Fully restart Spotify after INI edits.
; Optional details go only to Floggfy-diagnostics.log (5 MiB), never Floggfy.log.
DebugLog=0
; Requires DebugLog=1: cached playback target and local actions.
; Set 0 to opt out, including when DebugNetworking=1.
; Use exactly 1 to enable. Device names/IDs are omitted; senders may be unknown.
DebugConnect=1
; Deep read-only networking diagnostics; default off. Fully restart after edits.
; Requires Log=1 and DebugLog=1. Use exactly 1 to enable; 0/invalid values disable.
; Disabled means no decoded-message hook or enrichment network observations.
; 1 adds networking observations to Floggfy-diagnostics.log.
; Summarizes known Connect/control and enrichment I/O with timing for correlation.
; No raw messages, media, credentials, URLs, device names or device IDs are logged.
; Unobserved traffic and command execution remain unknown; no commands are changed.
DebugNetworking=0
; Extra callback/stall diagnostics. Requires DebugNetworking=1, Log=1, DebugLog=1.
; Default off; exactly 1 enables callback profiling and slow/pending activities.
; Basic DebugLog does no per-callback profiling; no dumps or raw payloads.
DebugHookDiagnostics=0

[History]
; Maximum compressed audio held in RAM for one track.
MaxBufferedMiB=500
